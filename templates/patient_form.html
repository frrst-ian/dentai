{% extends 'base.html' %}{% block content %}<h1>{{ 'Edit Patient' if patient else 'Add Patient' }}</h1><div class="panel"><form method="post" class="form-grid">{% if not patient %}<label>Patient ID<input name="patient_id"></label>{% endif %}<label>Name<input name="name" value="{{patient.name if patient else ''}}" required></label><label>Age<input type="number" name="age" value="{{patient.age if patient else ''}}"></label><label>Sex<select name="sex"><option>Male</option><option>Female</option></select></label><label>Phone<input name="phone" value="{{patient.phone if patient else ''}}"></label><label>Address<input name="address" value="{{patient.address if patient else ''}}"></label><label>Smoking<select name="smoking"><option>No</option><option>Yes</option></select></label><label>Diabetes<select name="diabetes"><option>No</option><option>Yes</option></select></label><label>Dental pain<select name="dental_pain"><option>No</option><option>Yes</option></select></label><label>Bleeding gums<select name="bleeding_gums"><option>No</option><option>Yes</option></select></label><label>Caries count<input type="number" name="caries_count" value="{{patient.caries_count if patient else 0}}"></label><label>Missing teeth<input type="number" name="missing_teeth" value="{{patient.missing_teeth if patient else 0}}"></label><label>Oral hygiene<select name="oral_hygiene"><option>Good</option><option>Fair</option><option>Poor</option></select></label><label>Periodontal status<select name="periodontal_status"><option>Healthy</option><option>Mild</option><option>Moderate</option><option>Severe</option></select></label><div><button>Save Patient</button></div></form></div>{% endblock %}
