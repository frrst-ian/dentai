{% extends 'base.html' %}{% block content %}<h1>Dashboard</h1><div class="cards"><div class="card"><b>{{ stats.patients }}</b><span>Patients</span></div><div class="card"><b>{{ stats.appointments }}</b><span>Appointments</span></div><div class="card"><b>{{ stats.users }}</b><span>Users</span></div></div><div class="panel"><h2>Recent Patients</h2><table><tr><th>ID</th><th>Name</th><th>Age</th><th>Status</th><th>Action</th></tr>{% for p in recent %}<tr><td>{{p.patient_id}}</td><td>{{p.name}}</td><td>{{p.age}}</td><td>{{p.status}}</td><td><a class="btn" href="/patients/{{p.id}}/chart">Open Dental Chart</a></td></tr>{% endfor %}</table></div>{% endblock %}
