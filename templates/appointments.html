{% extends 'base.html' %}{% block content %}<h1>Appointments</h1><div class="panel"><form method="post" action="/appointments/add" class="record-form"><select name="patient_id" required>{% for p in patients %}<option value="{{p.patient_id}}">{{p.patient_id}} – {{p.name}}</option>{% endfor %}</select><input name="patient_name" placeholder="Patient name" required><input name="date" type="date" required><input name="time" type="time" required><input name="dentist" placeholder="Dentist"><input name="purpose" placeholder="Purpose"><button>Add Appointment</button></form><table><tr><th>Date</th><th>Time</th><th>Patient</th><th>Dentist</th><th>Purpose</th><th>Status</th></tr>{% for a in appointments %}<tr><td>{{a.date}}</td><td>{{a.time}}</td><td>{{a.patient_name}}</td><td>{{a.dentist}}</td><td>{{a.purpose}}</td><td>{{a.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
