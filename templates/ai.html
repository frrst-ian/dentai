{% extends 'base.html' %}{% block content %}<div class="row"><div><h1>🤖 AI Prediction</h1><p class="muted">Patient: <strong>{{patient.name}}</strong> · {{patient.patient_id}}</p></div><a class="btn secondary" href="/patients/{{patient.id}}/chart">← Back to Patient</a></div><div class="panel"><div class="notice"><strong>Decision-support only:</strong> This prototype prediction is based on the current patient record and should not replace a dentist's professional judgment.</div><form method="post" action="/predict" class="form-grid"><input type="hidden" name="patient_id" value="{{patient.patient_id}}"><input type="hidden" name="patient_name" value="{{patient.name}}"><label>Age<input name="age" value="{{patient.age}}" required></label><label>Sex<select name="sex"><option {% if patient.sex=='Male' %}selected{% endif %}>Male</option><option {% if patient.sex=='Female' %}selected{% endif %}>Female</option></select></label><label>Smoking<select name="smoking"><option {% if patient.smoking=='Yes' %}selected{% endif %}>Yes</option><option {% if patient.smoking=='No' %}selected{% endif %}>No</option></select></label><label>Diabetes<select name="diabetes"><option {% if patient.diabetes=='Yes' %}selected{% endif %}>Yes</option><option {% if patient.diabetes=='No' %}selected{% endif %}>No</option></select></label><label>Dental Pain<select name="dental_pain"><option {% if patient.dental_pain=='Yes' %}selected{% endif %}>Yes</option><option {% if patient.dental_pain=='No' %}selected{% endif %}>No</option></select></label><label>Bleeding Gums<select name="bleeding_gums"><option {% if patient.bleeding_gums=='Yes' %}selected{% endif %}>Yes</option><option {% if patient.bleeding_gums=='No' %}selected{% endif %}>No</option></select></label><label>Caries Count<input type="number" name="caries_count" min="0" value="{{patient.caries_count}}"></label><label>Missing Teeth<input type="number" name="missing_teeth" min="0" value="{{patient.missing_teeth}}"></label><label>Oral Hygiene<select name="oral_hygiene"><option {% if patient.oral_hygiene=='Good' %}selected{% endif %}>Good</option><option {% if patient.oral_hygiene=='Fair' %}selected{% endif %}>Fair</option><option {% if patient.oral_hygiene=='Poor' %}selected{% endif %}>Poor</option></select></label><label>Periodontal Status<select name="periodontal_status"><option {% if patient.periodontal_status=='Healthy' %}selected{% endif %}>Healthy</option><option {% if patient.periodontal_status=='Mild' %}selected{% endif %}>Mild</option><option {% if patient.periodontal_status=='Moderate' %}selected{% endif %}>Moderate</option><option {% if patient.periodontal_status=='Severe' %}selected{% endif %}>Severe</option></select></label><label>AI Model<select name="model"><option>Random Forest</option><option>Logistic Regression</option><option>Decision Tree</option><option>Support Vector Machine</option><option>Gradient Boosting</option></select></label><div><button class="btn ai" type="submit">🤖 Run AI Prediction</button></div></form></div>{% endblock %}
